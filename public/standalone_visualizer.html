<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseWave - Standalone Clean Music Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #bgCanvas { z-index: 1; }
    #threeCanvas { z-index: 2; pointer-events: none; }
    #hudCanvas { z-index: 3; pointer-events: none; }
    
    /* Clean Screen Overlay: ONLY the Title or user text is visible on the screen */
    #titleOverlay {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #titleText {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
    }
    #subtitleText {
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
    }

    /* Floating Discreet Trigger Button - auto-fades */
    #controlTrigger {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 40;
      background: rgba(20, 20, 25, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    #controlTrigger:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Hidden Control Drawer */
    #drawer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 105%);
      width: min(900px, 94vw);
      max-height: 80vh;
      background: rgba(10, 12, 18, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      z-index: 50;
      padding: 24px;
      color: #fff;
      overflow-y: auto;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #drawer.open {
      transform: translate(-50%, 0%);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.2); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .control-group { margin-bottom: 16px; }
    .control-group label { display: block; font-size: 12px; font-weight: 600; color: #a1a1aa; margin-bottom: 6px; text-transform: uppercase; }
    input[type=range] { width: 100%; accent-color: #00f0ff; }
    select, input[type=text] { width: 100%; padding: 8px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 6px; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Clean Visualization Canvases -->
  <canvas id="bgCanvas"></canvas>
  <canvas id="threeCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>

  <!-- Clean Screen Single Title Overlay (Only visuals and this title are visible on screen) -->
  <div id="titleOverlay">
    <div id="titleText">PULSEWAVE</div>
    <div id="subtitleText">AUDIO VISUALIZER</div>
  </div>

  <!-- Discreet Collapsible Trigger -->
  <button id="controlTrigger" onclick="toggleDrawer()">Controls [H]</button>

  <!-- Control Center Drawer -->
  <div id="drawer">
    <div class="drawer-header">
      <h2 style="font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em;">PULSEWAVE CONTROL CENTER</h2>
      <button class="btn" onclick="toggleDrawer()">Close [Esc]</button>
    </div>

    <div class="grid">
      <!-- Audio Controls -->
      <div class="control-group">
        <label>Audio Source</label>
        <button id="playBtn" class="btn" style="width: 100%; margin-bottom: 8px;" onclick="window.visualizer.togglePlay()">▶ Start Audio</button>
        <select id="trackSelect" onchange="window.visualizer.setTrack(this.value)">
          <option value="synthwave">Neon Horizon (Synthwave)</option>
          <option value="chillwave">Solar Aurora (Ambient Lofi)</option>
          <option value="techno">Cyber Pulse (Acid Club)</option>
        </select>
      </div>

      <!-- Theme & Visuals -->
      <div class="control-group">
        <label>Theme</label>
        <select id="themeSelect" onchange="window.visualizer.setTheme(this.value)">
          <option value="Cyberpunk">Cyberpunk</option>
          <option value="Vintage">Vintage</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Kinetic">Kinetic Typography</option>
        </select>
        <button class="btn" style="width: 100%; margin-top: 8px;" onclick="window.visualizer.randomize()">🎲 Randomize All</button>
      </div>

      <!-- Visualizer Mode -->
      <div class="control-group">
        <label>Visualization Style</label>
        <select id="visSelect" onchange="window.visualizer.setVisualizer(this.value)">
          <option value="cosmic">Cosmic Galaxy & 3D Core</option>
          <option value="tunnel">Neon Cyber Tunnel</option>
          <option value="radial">360 Radial Spectrum</option>
          <option value="matrix">Matrix Floating Crystals</option>
        </select>
      </div>

      <!-- Effect Sliders -->
      <div class="control-group">
        <label>Effect Intensity</label>
        <input type="range" min="0.2" max="2.5" step="0.1" value="1.0" oninput="window.visualizer.setIntensity(this.value)">
      </div>
    </div>
  </div>

  <script>
    /**
     * PulseWave Standalone Visualizer Engine
     * Complete modular implementation: AudioEngine, VisualEngine, ThemeManager, UIController
     */
    
    // --- THEMES ---
    const THEMES = {
      Cyberpunk: { primary: '#00f0ff', secondary: '#ff007f', bg: '#050713', wave: '#00f0ff' },
      Vintage: { primary: '#d97706', secondary: '#f59e0b', bg: '#140c08', wave: '#fbbf24' },
      Fantasy: { primary: '#c084fc', secondary: '#fbbf24', bg: '#0a0518', wave: '#f472b6' },
      Kinetic: { primary: '#ef4444', secondary: '#ffffff', bg: '#08080a', wave: '#ef4444' }
    };
    let currentTheme = 'Cyberpunk';

    // --- AUDIO ENGINE ---
    let audioCtx = null;
    let analyser = null;
    let masterGain = null;
    let isPlaying = false;
    let synthTimer = null;
    let synthStep = 0;
    let activeTrack = 'synthwave';
    let freqData = new Uint8Array(512);
    let timeData = new Uint8Array(512);

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.8;
      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      timeData = new Uint8Array(analyser.frequencyBinCount);
    }

    function triggerKick(t) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
      g.gain.setValueAtTime(0.8, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.32);
    }

    function startSynth() {
      initAudio();
      if (synthTimer) clearInterval(synthTimer);
      let nextTime = audioCtx.currentTime + 0.05;
      synthTimer = setInterval(() => {
        const bpm = 124;
        const spb = (60 / bpm) / 4;
        while (nextTime < audioCtx.currentTime + 0.1) {
          if (synthStep % 4 === 0) triggerKick(nextTime);
          synthStep = (synthStep + 1) % 32;
          nextTime += spb;
        }
      }, 25);
    }

    // --- THREE.JS 3D ENGINE ---
    let scene, camera, renderer, galaxy, orb;
    let width = window.innerWidth, height = window.innerHeight;

    function init3D() {
      const canvas = document.getElementById('threeCanvas');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
      camera.position.z = 30;

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(width, height);

      // Galaxy Particles
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(8000 * 3);
      const col = new Float32Array(8000 * 3);
      for(let i = 0; i < 8000; i++) {
        const r = Math.random() * 40 + 2;
        const a = Math.random() * Math.PI * 2;
        pos[i*3] = Math.cos(a) * r;
        pos[i*3+1] = (Math.random() - 0.5) * 15;
        pos[i*3+2] = Math.sin(a) * r;
        col[i*3] = 0.0; col[i*3+1] = 0.9; col[i*3+2] = 1.0;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({ size: 1.6, vertexColors: true, transparent: true, opacity: 0.8 });
      galaxy = new THREE.Points(geo, mat);
      scene.add(galaxy);

      // Audio Orb
      const orbGeo = new THREE.IcosahedronGeometry(6, 2);
      const wire = new THREE.WireframeGeometry(orbGeo);
      orb = new THREE.LineSegments(wire, new THREE.LineBasicMaterial({ color: 0xff007f }));
      scene.add(orb);
    }

    // --- 2D RENDERING LOOP ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const hudCanvas = document.getElementById('hudCanvas');
    const hudCtx = hudCanvas.getContext('2d');

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      bgCanvas.width = width; bgCanvas.height = height;
      hudCanvas.width = width; hudCanvas.height = height;
      if (renderer && camera) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }
    }
    window.addEventListener('resize', resize);

    let effectIntensity = 1.0;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (analyser && isPlaying) {
        analyser.getByteFrequencyData(freqData);
        analyser.getByteTimeDomainData(timeData);
      }

      const bass = (freqData[2] || 0) / 255.0;

      // 1. Background
      bgCtx.fillStyle = THEMES[currentTheme].bg;
      bgCtx.fillRect(0, 0, width, height);

      // 2. 3D Scene
      if (galaxy) galaxy.rotation.y += 0.002 + bass * 0.01;
      if (orb) {
        orb.rotation.x += 0.005;
        orb.rotation.y += 0.008;
        const s = 1.0 + bass * 0.4 * effectIntensity;
        orb.scale.set(s, s, s);
      }
      if (renderer) renderer.render(scene, camera);

      // 3. 2D Waveform
      hudCtx.clearRect(0, 0, width, height);
      hudCtx.strokeStyle = THEMES[currentTheme].wave;
      hudCtx.lineWidth = 3;
      hudCtx.beginPath();
      const slice = width / timeData.length;
      let x = 0;
      for (let i = 0; i < timeData.length; i++) {
        const v = timeData[i] / 128.0;
        const y = height * 0.75 + (v - 1.0) * 80 * effectIntensity;
        if (i === 0) hudCtx.moveTo(x, y);
        else hudCtx.lineTo(x, y);
        x += slice;
      }
      hudCtx.stroke();
    }

    // --- UI CONTROLLER & PUBLIC API ---
    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }

    window.visualizer = {
      play: async () => {
        initAudio();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        isPlaying = true;
        startSynth();
        document.getElementById('playBtn').textContent = '❚❚ Pause Audio';
      },
      pause: () => {
        isPlaying = false;
        if (synthTimer) clearInterval(synthTimer);
        document.getElementById('playBtn').textContent = '▶ Start Audio';
      },
      togglePlay: () => {
        if (isPlaying) window.visualizer.pause();
        else window.visualizer.play();
      },
      setTheme: (t) => {
        if (THEMES[t]) currentTheme = t;
      },
      setVisualizer: (mode) => {
        if (orb) orb.visible = mode === 'cosmic' || mode === 'radial';
        if (galaxy) galaxy.visible = mode === 'cosmic';
      },
      setTrack: (trk) => {
        activeTrack = trk;
      },
      setIntensity: (val) => {
        effectIntensity = parseFloat(val);
      },
      randomize: () => {
        const themes = Object.keys(THEMES);
        const rand = themes[Math.floor(Math.random() * themes.length)];
        window.visualizer.setTheme(rand);
        document.getElementById('themeSelect').value = rand;
      }
    };

    // Hotkey listener (H = toggle drawer, Space = play/pause)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') toggleDrawer();
      if (e.key === 'Escape') document.getElementById('drawer').classList.remove('open');
      if (e.key === ' ') {
        e.preventDefault();
        window.visualizer.togglePlay();
      }
    });

    // Start
    init3D();
    resize();
    renderLoop();
  </script>
</body>
</html>
